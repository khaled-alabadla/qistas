{% load static %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block code %}{% endblock %} · قِسطاس</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="grid min-h-screen place-items-center bg-navy px-4 text-center text-sand">
  <div class="max-w-md">
    <p class="text-6xl font-bold text-bronze"><bdi dir="ltr">{% block bigcode %}{% endblock %}</bdi></p>
    <h1 class="mt-4 text-xl font-semibold text-white">{% block title %}{% endblock %}</h1>
    <p class="mt-2 text-sm text-sand/70">{% block message %}{% endblock %}</p>
    <a href="/" class="mt-6 inline-flex rounded-md bg-bronze px-4 py-2 text-sm font-medium text-navy">
      العودة إلى الرئيسية
    </a>
  </div>
</body>
</html>
