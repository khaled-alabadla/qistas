[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qistas"
version = "0.1.0"
description = "قِسطاس — Arabic-first Law Practice Management System (Foundation)"
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Proprietary" }

# Exact pins. A compiled lock file is a Phase 14 concern (see docs/adr/0026).
dependencies = [
    "Django==5.2.17",
    "psycopg[binary]==3.3.5",
    "django-environ==0.14.0",
    "whitenoise==6.12.0",
    "django-axes==8.3.1",
    "django-otp==1.7.3",
    "qrcode==8.2",
    "django-auditlog==3.4.1",
    "django-htmx==1.29.0",
    "django-storages[s3]==1.14.4",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",          # 8.4.2 has PYSEC-2026-1845
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "Faker==37.8.0",
    "ruff==0.14.2",
    "django-debug-toolbar==6.0.0",
    "pip-audit==2.9.0",
]

# This project is a Django application, not an importable library.
# An empty package set lets `pip install -e ".[dev]"` install dependencies
# without packaging any modules.
[tool.setuptools]
py-modules = []

# ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    "*/migrations/*",
    ".venv",
    "bin",
    "staticfiles",
]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "UP",                # pyupgrade
    "DJ",                # flake8-django
    "B",                 # flake8-bugbear
    "C4",                # flake8-comprehensions
    "T20",               # flake8-print (no stray print())
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode (Arabic strings are intentional)
    "RUF012",                       # ClassVar on Django Meta/admin attrs is noise
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S101"]
"config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "config", "core"]

# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db --strict-markers -ra"
markers = [
    "postgres: test requires a real PostgreSQL backend (skipped on other engines)",
]

# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["accounts", "audit", "core", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
