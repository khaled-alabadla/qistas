{% comment %}params: title, subtitle; block content via caller{% endcomment %}
<section class="rounded-lg border border-line bg-white p-5">
  {% if title %}
    <header class="mb-3">
      <h3 class="text-base font-semibold text-ink">{{ title }}</h3>
      {% if subtitle %}<p class="text-sm text-slate/70">{{ subtitle }}</p>{% endif %}
    </header>
  {% endif %}
  {{ body }}
</section>
