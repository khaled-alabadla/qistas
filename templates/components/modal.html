{% comment %}params: id, title, body, footer. Toggle with Alpine: $dispatch('open-modal-<id>'){% endcomment %}
<div x-data="{ open: false }"
     @open-modal-{{ id }}.window="open = true"
     @keydown.escape.window="open = false"
     x-show="open" style="display:none" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="fixed inset-0 bg-black/40" @click="open = false"></div>
  <div class="relative z-10 w-full max-w-lg rounded-lg bg-white p-6 shadow-lg" role="dialog" aria-modal="true"
       aria-labelledby="{{ id }}-title">
    <h2 id="{{ id }}-title" class="mb-3 text-lg font-semibold text-ink">{{ title }}</h2>
    <div class="text-sm text-slate">{{ body }}</div>
    <div class="mt-5 flex justify-end gap-2">{{ footer }}</div>
  </div>
</div>
