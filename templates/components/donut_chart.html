{% comment %}params: segments (precomputed by the `donut_chart` tag), total, size{% endcomment %}
{% load i18n qistas %}
{% if segments %}
<div class="flex items-center gap-5">
  <svg viewBox="0 0 36 36" width="{{ size }}" height="{{ size }}" class="-rotate-90 shrink-0" aria-hidden="true">
    <circle cx="18" cy="18" r="15.9155" fill="none" stroke="#eef1f5" stroke-width="3.5"></circle>
    {% for s in segments %}
      <circle cx="18" cy="18" r="15.9155" fill="none" stroke="{{ s.color }}" stroke-width="3.5"
              stroke-dasharray="{{ s.dasharray }}" stroke-dashoffset="{{ s.dashoffset }}"></circle>
    {% endfor %}
  </svg>
  <ul class="min-w-0 flex-1 space-y-1.5 text-sm">
    {% for s in segments %}
      <li class="flex items-center gap-2">
        <span class="h-2.5 w-2.5 shrink-0 rounded-full" style="background-color: {{ s.color }}" aria-hidden="true"></span>
        <span class="min-w-0 flex-1 truncate text-slate">{{ s.label }}</span>
        <span class="shrink-0 font-medium text-ink">{% num s.value %}</span>
      </li>
    {% endfor %}
  </ul>
</div>
{% else %}
  <p class="text-sm text-slate/50">{% translate "لا بيانات." %}</p>
{% endif %}
