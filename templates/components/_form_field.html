{% load i18n %}
{% comment %}Renders a single bound form field with label, errors, help text.{% endcomment %}
<div class="mb-4">
  {% if field.label %}
    <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium text-ink">
      {{ field.label }}{% if field.field.required %}<span class="text-danger" aria-hidden="true"> *</span>{% endif %}
    </label>
  {% endif %}
  {{ field }}
  {% if field.help_text %}
    <p class="mt-1 text-xs text-slate/70">{{ field.help_text }}</p>
  {% endif %}
  {% for error in field.errors %}
    <p class="mt-1 text-xs text-danger">{{ error }}</p>
  {% endfor %}
</div>
