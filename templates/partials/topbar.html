{% load i18n %}
<header class="sticky top-0 z-20 flex h-16 items-center gap-3 border-b border-line bg-white/95 px-4 backdrop-blur sm:px-8">
  <button type="button" @click="sidebarOpen = !sidebarOpen"
          class="rounded-md p-2 text-slate hover:bg-mist lg:hidden"
          aria-label="{% translate 'فتح القائمة' %}">
    <span aria-hidden="true">☰</span>
  </button>

  <div class="min-w-0 flex-1">
    {% block breadcrumb %}{% endblock %}
  </div>

  {% if user.is_authenticated %}
  <div x-data="{ open: false }" class="relative">
    <button type="button" @click="open = !open" class="flex items-center gap-2 rounded-md px-2 py-1.5 text-sm hover:bg-mist"
            :aria-expanded="open.toString()">
      <span class="grid h-8 w-8 place-items-center rounded-full bg-navy text-xs font-semibold text-white">
        {{ user.get_short_name|slice:":1"|upper }}
      </span>
      <span class="hidden sm:inline">{{ user.get_full_name|default:user.email }}</span>
    </button>
    <div x-show="open" @click.outside="open = false" x-transition style="display:none"
         class="absolute end-0 mt-2 w-56 rounded-lg border border-line bg-white py-1 text-sm shadow-lg">
      <a href="{% url 'accounts:mfa_manage' %}" class="block px-4 py-2 hover:bg-mist">{% translate "التحقق بخطوتين" %}</a>
      <a href="{% url 'accounts:password_change' %}" class="block px-4 py-2 hover:bg-mist">{% translate "تغيير كلمة المرور" %}</a>
      <form method="post" action="{% url 'accounts:logout' %}" class="border-t border-line">
        {% csrf_token %}
        <button type="submit" class="block w-full px-4 py-2 text-start text-danger hover:bg-mist">
          {% translate "تسجيل الخروج" %}
        </button>
      </form>
    </div>
  </div>
  {% endif %}
</header>
