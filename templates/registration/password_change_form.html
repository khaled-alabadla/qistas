{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "تغيير كلمة المرور" %}{% endblock %}
{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="mb-4 text-xl font-semibold text-ink">{% translate "تغيير كلمة المرور" %}</h1>
    <form method="post" novalidate class="rounded-xl border border-line bg-white p-6">
      {% csrf_token %}
      {% for field in form %}{% include "components/_form_field.html" with field=field %}{% endfor %}
      <button type="submit" class="btn btn-primary">{% translate "حفظ" %}</button>
    </form>
  </div>
{% endblock %}
